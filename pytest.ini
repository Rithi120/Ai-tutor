[pytest]
markers =
    live_ai: opt-in test that may contact the configured AI provider

filterwarnings =
    # SWIG-generated extension types (PyMuPDF) on Python 3.12+: upstream, not Learnova
    # code, and nothing here can change it. Matched exactly, so any other warning shows.
    ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning
    ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning
    ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning
